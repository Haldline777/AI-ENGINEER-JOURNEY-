name: Update AI Engineer Journey Dashboard

on:
  schedule:
    # Runs every single day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it with a button anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run Analytics Engine Script
      run: python scripts/process_metrics.py

    - name: Commit and Push Updated Dashboard
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add README.md
        git commit -m "automation: dynamically updated portfolio metrics matrix" || exit 0
        git push
